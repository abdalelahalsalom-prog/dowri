<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>دوري - دليل سرافيس معربا</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      background: #f3f6f8;
      color: #222;
      padding-bottom: 30px;
    }

    /* الهيدر */
    .header {
      background: linear-gradient(135deg, #079b72, #0ca57a);
      color: white;
      text-align: center;
      padding: 65px 20px 45px;
      border-radius: 0 0 45px 45px;
    }

    .logo {
      font-size: 48px;
      font-weight: bold;
    }

    .bus-top {
      font-size: 48px;
      vertical-align: middle;
    }

    .subtitle {
      font-size: 24px;
      margin-top: 20px;
      opacity: 0.95;
    }

    /* الحاوية */
    .container {
      width: 92%;
      max-width: 700px;
      margin: 35px auto;
    }

    /* البطاقات */
    .card {
      background: white;
      border-radius: 30px;
      padding: 35px 25px;
      margin-bottom: 30px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.07);
    }

    .welcome {
      text-align: center;
    }

    .big-bus {
      font-size: 75px;
      margin-bottom: 10px;
    }

    h2 {
      color: #087f60;
      font-size: 31px;
      margin-bottom: 25px;
    }

    .description {
      font-size: 22px;
      line-height: 1.9;
      margin-bottom: 25px;
    }

    /* المنطقة */
    .location-info {
      background: #fff3b8;
      padding: 18px;
      border-radius: 20px;
      font-size: 20px;
      margin-bottom: 15px;
    }

    .current-time {
      color: #777;
      font-size: 20px;
      margin-top: 10px;
    }

    /* زر الموقع */
    .location-button {
      width: 100%;
      border: none;
      background: #087f60;
      color: white;
      padding: 18px;
      border-radius: 18px;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
      transition: 0.2s;
    }

    .location-button:active {
      transform: scale(0.98);
    }

    .location-button:hover {
      background: #066d52;
    }

    .location-status {
      margin-top: 15px;
      padding: 14px;
      border-radius: 15px;
      background: #e8f7f2;
      color: #087f60;
      font-size: 17px;
      display: none;
    }

    /* عنوان الخطوط */
    .section-title {
      color: #087f60;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    /* بطاقة السرفيس */
    .route-card {
      border: 3px solid #e9ecef;
      border-radius: 25px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .route-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .route-name {
      color: #087f60;
      font-size: 28px;
      font-weight: bold;
    }

    .available {
      background: #d8f7df;
      color: #16863c;
      padding: 10px 15px;
      border-radius: 25px;
      font-size: 17px;
    }

    .route {
      font-size: 20px;
      color: #555;
      margin: 20px 0;
    }

    .start-button {
      width: 100%;
      border: none;
      background: #078660;
      color: white;
      padding: 18px;
      border-radius: 18px;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    .start-button:hover {
      background: #066d52;
    }

    /* نتيجة الموقع */
    .coordinates {
      margin-top: 15px;
      font-size: 16px;
      color: #666;
      direction: ltr;
    }

    /* الخريطة */
    #map {
      width: 100%;
      height: 350px;
      border-radius: 25px;
      margin-top: 20px;
      display: none;
      border: 2px solid #ddd;
    }

    /* الهاتف */
    @media (max-width: 500px) {
      .header {
        padding-top: 55px;
      }

      .logo {
        font-size: 43px;
      }

      .subtitle {
        font-size: 21px;
      }

      .card {
        padding: 30px 20px;
      }

      h2 {
        font-size: 28px;
      }

      .description {
        font-size: 20px;
      }

      .route-name {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <!-- رأس التطبيق -->
  <header class="header">
    <div class="logo">
      دوري 🚌
    </div>

    <div class="subtitle">
      دليل سرافيس معربا
    </div>
  </header>


  <main class="container">

    <!-- الترحيب -->
    <section class="card welcome">

      <div class="big-bus">
        🚌
      </div>

      <h2>
        أهلاً بك في دوري
      </h2>

      <p class="description">
        تطبيق يساعدك على معرفة خطوط السرافيس والمواقف
        داخل معربا.
      </p>

      <!-- المنطقة -->
      <div class="location-info">
        📍 المنطقة: <strong>معربا</strong>
      </div>

      <!-- الوقت -->
      <div class="current-time">
        🕐 الوقت الآن:
        <span id="time">--:--:--</span>
      </div>

      <!-- زر تحديد الموقع -->
      <button
        class="location-button"
        onclick="getLocation()">
        📍 تحديد موقعي
      </button>

      <div
        id="locationStatus"
        class="location-status">
      </div>

      <div
        id="coordinates"
        class="coordinates">
      </div>

      <!-- الخريطة -->
      <div id="map"></div>

    </section>


    <!-- خطوط السرافيس -->
    <section class="card">

      <div class="section-title">
        🚌 خطوط السرافيس
      </div>


      <!-- خط 101 -->
      <div class="route-card">

        <div class="route-header">

          <div class="route-name">
            سرفيس 101
          </div>

          <div class="available">
            متاح
          </div>

        </div>

        <div class="route">
          📍 الخط:
          <strong>معربا ↔ دمشق</strong>
        </div>

        <button
          class="start-button"
          onclick="startRoute('101')">
          ▶️ بدء رحلة سرفيس 101
        </button>

      </div>

    </section>

  </main>


  <script>

    /* =========================
       الساعة
    ========================= */

    function updateTime() {

      const now = new Date();

      const hours =
        String(now.getHours()).padStart(2, '0');

      const minutes =
        String(now.getMinutes()).padStart(2, '0');

      const seconds =
        String(now.getSeconds()).padStart(2, '0');

      document.getElementById("time").textContent =
        `${hours}:${minutes}:${seconds}`;
    }

    updateTime();

    setInterval(updateTime, 1000);


    /* =========================
       تحديد الموقع
    ========================= */

    function getLocation() {

      const status =
        document.getElementById("locationStatus");

      const coordinates =
        document.getElementById("coordinates");

      status.style.display = "block";

      status.textContent =
        "⏳ جارٍ تحديد موقعك...";

      coordinates.textContent = "";


      if (!navigator.geolocation) {

        status.textContent =
          "❌ جهازك لا يدعم تحديد الموقع.";

        return;
      }


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;


          status.textContent =
            "✅ تم تحديد موقعك بنجاح.";

          coordinates.innerHTML =
            `خط العرض: ${latitude.toFixed(6)}
             <br>
             خط الطول: ${longitude.toFixed(6)}`;


          /* فتح الموقع على خرائط Google */

          const googleMaps =
            `https://www.google.com/maps?q=${latitude},${longitude}`;

          const mapButton =
            document.createElement("button");

          mapButton.className =
            "location-button";

          mapButton.textContent =
            "🗺️ فتح موقعي على الخريطة";

          mapButton.onclick = function() {

            window.open(
              googleMaps,
              "_blank"
            );

          };


          status.appendChild(mapButton);

        },


        function(error) {

          let message =
            "❌ لم نتمكن من تحديد موقعك.";

          if (error.code === 1) {

            message =
              "⚠️ تم رفض إذن الوصول إلى الموقع. اسمح للتطبيق بالوصول إلى موقعك.";

          }

          else if (error.code === 2) {

            message =
              "⚠️ تعذر العثور على موقعك حالياً.";

          }

          else if (error.code === 3) {

            message =
              "⚠️ انتهى وقت محاولة تحديد الموقع.";

          }

          status.textContent = message;

        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }

      );

    }


    /* =========================
       بدء الرحلة
    ========================= */

    function startRoute(route) {

      if (route === "101") {

        alert(
          "🚌 سرفيس 101\n\nالخط: معربا ↔ دمشق\n\nسيتم إضافة تفاصيل الرحلة والمواقف في المرحلة القادمة."
        );

      }

    }

  </script>

</body>
</html>
